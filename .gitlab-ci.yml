stages:
  - genLicense
  - checkLicense
  - build
  - cov
  - clean_build
  - build_iotStudio
  - clean_cov

genLicense:
  variables:
    CODE_COMPILE_ARCH: 'EAGLE_ANDES'
    COV_PF_CATALOG: 'ZIGBEE'
  stage: genLicense
  before_script:
  script:
    - date
    - generat_license_list
    - date
  artifacts:
    paths:
    - "license_list_gen.txt"
    - "no_license_list_gen.txt"
    - "mismatch_license_file_gen.txt"
  when: manual

checkLicense:
  variables:
    CODE_COMPILE_ARCH: 'EAGLE_ANDES'
    COV_PF_CATALOG: 'ZIGBEE'
  stage: checkLicense
  tags:
    - LINUX
  allow_failure: yes
  before_script:
  script:
    - date
    - check_license
    #- generat_license_list # For no license files
    - date
  artifacts:
    when: always
    paths:
    - "mismatch_license.txt"
    - "no_license*.txt"
    - "unknow_type_file.txt"

build:
  stage: build
  tags:
    - LINUX
    - TC32
  before_script:
  script:
    - which tc32-elf-gcc
    - chmod +x tl_rf4ce_sdk/tools/*
    - date
    - ls ./tl_rf4ce_sdk/
    - $TC32_ECLIPSE_BUILD  -data ${CI_PIPELINE_ID}_WS1  -import ./tl_rf4ce_sdk/build/tlsr_tc32 -cleanBuild tl_rf4ce_sdk/zrc2_rc_8258
    - date

  artifacts:
    paths:
    - "tl_rf4ce_sdk/build/tlsr_tc32/zrc2_rc_8258/*.bin"
    - "tl_rf4ce_sdk/build/tlsr_tc32/zrc2_rc_8258/*.lst"
    - "tl_rf4ce_sdk/build/tlsr_tc32/zrc2_rc_8258/*.elf"

build_iotStudio:
  variables:
    BUILD_DEMOS: "zrc2_rc zrc2_dongle"
    BUILD_PLATFORMS: "b92 tl321x"
  stage: build_iotStudio
  tags:
    - TELINKIDE_LINUX
  before_script:
  script:
    - ls
    - pwd
    - chmod +x tl_rf4ce_sdk/tools/*
    - date
    - |
      for DEMO in $BUILD_DEMOS; do
        echo "--------------- Will build ${DEMO}_tl321x Demo -----------------"
        $TELINK_IDE_BUILD -data ${CI_PIPELINE_ID}_WS \
            -import ./tl_rf4ce_sdk/build/tl_riscv_tl321x \
            -cleanBuild tl_rf4ce_sdk_tl321x/${DEMO}_tl321x
      done
    - |
      for DEMO in $BUILD_DEMOS; do
        echo "--------------- Will build ${DEMO}_b92 Demo -----------------"
        $TELINK_IDE_BUILD -data ${CI_PIPELINE_ID}_WS \
            -import ./tl_rf4ce_sdk/build/tlsr_riscv_b92 \
            -cleanBuild tl_rf4ce_sdk_b92/${DEMO}_b92
      done
    - date
  artifacts:
    paths:
    - "tl_rf4ce_sdk/build/**/**/*.bin"
    - "tl_rf4ce_sdk/build/**/**/*.lst"
    - "tl_rf4ce_sdk/build/**/**/*.elf"
    
# The cov job definition
cov:
  variables:    
    CODE_COMPILE_ARCH: 'TC32'    
    COV_PF_CATALOG: 'ZIGBEE'  
  stage: cov 
  tags:    
    - COV    
    - LINUX    
    - TC32
  before_script:  
  script:    
    - chmod +x tl_rf4ce_sdk/*.sh  
    - $COV_B COV_$CI_PROJECT_NAME $COV_B_TEMPLATE/$CODE_COMPILE_ARCH $TC32_ECLIPSE_BUILD  -data ${CI_PIPELINE_ID}_WS  -import ./tl_rf4ce_sdk/build/tlsr_tc32/  -cleanBuild tl_rf4ce_sdk/build/tlsr_tc32/zrc2_rc_8258    
    - $COV_A COV_$CI_PROJECT_NAME    
    - cov_add_commit_steam_project_2_platform.sh
  when: manual
        
clean_build:
  stage: clean_build
  tags:
    - LINUX
    - TC32
  script:
    - ls -a
    - rm -r * .git*
    - ls -a
  when: always

clean_cov:  
  stage: clean_cov  
  tags:    
    - COV    
    - LINUX    
    - TC32    
  script:    
    - ls -a    
    - rm -rf * .git*    
    - ls -a  
  when: manual
